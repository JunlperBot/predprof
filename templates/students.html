<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <span class="navbar-brand">Student</span>
            <div class="d-flex">
                <span class="navbar-text me-3">Welcome, {{ session.get('full_name', 'Student') }}</span>
                <a href="/logout" class="btn btn-outline-light">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="alert alert-info">
            <h4 class="alert-heading">Redirecting...</h4>
            <p>You will be redirected to the meal selection page shortly.</p>
            <p>If you are not redirected automatically, <a href="/students/meals">click here</a>.</p>
        </div>
    </div>

    <script>
        // Автоматическое перенаправление через 3 секунды
        setTimeout(function() {
            window.location.href = '/students/meals';
        }, 3000);
    </script>
</body>
</html>

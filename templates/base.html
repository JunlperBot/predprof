<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <title>Login System</title>
</head>
<body>
    <!-- Кнопка регистрации в правом верхнем углу -->
    <a href="/register" class="btn btn-primary position-fixed top-0 end-0 m-3" style="z-index: 1000;">
        Register
    </a>

    <div class="container vh-100 d-flex align-items-center justify-content-center">
        <div class="col-md-5">
            <form method="POST" action="/" class="p-4 border rounded shadow-sm">
                <h1 class="h3 mb-4 fw-normal text-center">Please sign in</h1>

                <!-- Выбор типа пользователя -->
                <div class="mb-4">
                    <label class="form-label fw-bold">I am a:</label>
                    <div class="d-flex justify-content-between">
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="user_type" id="student" value="student" checked required>
                            <label class="form-check-label" for="student">Student</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="user_type" id="cook" value="cook" required>
                            <label class="form-check-label" for="cook">Cook</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="user_type" id="admin" value="admin" required>
                            <label class="form-check-label" for="admin">Admin</label>
                        </div>
                    </div>
                </div>

                <div class="form-floating mb-3">
                    <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" required>
                    <label for="email">Email address</label>
                </div>

                <div class="form-floating mb-4">
                    <input type="password" class="form-control" id="password" name="password" placeholder="Password" required>
                    <label for="password">Password</label>
                </div>

                <button class="btn btn-primary w-100 py-2 mb-3" type="submit">Sign in</button>

                <p class="text-center text-muted mt-3">
                    Don't have an account? <a href="/register">Register</a>
                </p>
            </form>
        </div>
    </div>
</body>
</html>

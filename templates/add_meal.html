<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Добавить блюдо</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-success">
        <div class="container-fluid">
            <span class="navbar-brand">Добавить блюдо</span>
            <div class="d-flex">
                <a href="/cooks/meals" class="btn btn-outline-light me-2"><i class="bi bi-arrow-left"></i> Назад к меню</a>
                <a href="/logout" class="btn btn-outline-light">Выйти</a>
            </div>
        </div>
    </nav>
    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card">
                    <div class="card-header bg-light"><h4 class="mb-0"><i class="bi bi-plus-circle"></i> Добавление нового блюда</h4></div>
                    <div class="card-body">
                        <form method="POST" action="/cooks/meals/add">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="name" class="form-label">Название блюда</label>
                                    <input type="text" class="form-control" id="name" name="name" placeholder="Например: Суп куриный" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="price" class="form-label">Цена (руб.)</label>
                                    <input type="number" step="0.01" class="form-control" id="price" name="price" placeholder="120" required>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="description" class="form-label">Описание</label>
                                <textarea class="form-control" id="description" name="description" rows="2" placeholder="Короткое описание блюда" required></textarea>
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="meal_type" class="form-label">Тип блюда</label>
                                    <select class="form-select" id="meal_type" name="meal_type" required>
                                        <option value="" disabled selected>Выберите тип</option>
                                        <option value="breakfast">Завтрак</option>
                                        <option value="lunch">Обед</option>
                                    </select>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Доступность</label>
                                    <div class="form-check mt-2">
                                        <input class="form-check-input" type="checkbox" id="available" name="available" checked>
                                        <label class="form-check-label" for="available">Доступно для заказа</label>
                                    </div>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="tags" class="form-label">Теги (через запятую)</label>
                                <input type="text" class="form-control" id="tags" name="tags" placeholder="Например: вегетарианское, безглютеновое, высокобелковое">
                            </div>
                            <div class="mb-3">
                                <label for="ingredients" class="form-label">Ингредиенты</label>
                                <textarea class="form-control" id="ingredients" name="ingredients" rows="3" placeholder="Перечислите ингредиенты через запятую"></textarea>
                                <div class="form-text">Важно для фильтрации аллергенов у студентов.</div>
                            </div>
                            <div class="alert alert-info">
                                <h6><i class="bi bi-info-circle"></i> Советы по заполнению:</h6>
                                <ul class="mb-0">
                                    <li>Укажите все ингредиенты для правильной фильтрации аллергенов</li>
                                    <li>Добавьте теги для удобного поиска блюд</li>
                                    <li>Установите реалистичную цену</li>
                                </ul>
                            </div>
                            <div class="d-flex justify-content-between">
                                <a href="/cooks/meals" class="btn btn-outline-secondary"><i class="bi bi-x-circle"></i> Отмена</a>
                                <button type="submit" class="btn btn-success"><i class="bi bi-check-circle"></i> Добавить блюдо</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>

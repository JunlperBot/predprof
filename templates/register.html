<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <title>Register</title>
</head>
<body>
    <a href="/" class="btn btn-outline-primary position-fixed top-0 start-0 m-3" style="z-index: 1000;">
        Login
    </a>

    <div class="container vh-100 d-flex align-items-center justify-content-center">
        <div class="col-md-6">
            <form method="POST" action="/register" class="p-4 border rounded shadow-sm">
                <h1 class="h3 mb-4 fw-normal text-center">Create Account</h1>

                <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="fullName" name="full_name" placeholder="Adam Doe" required>
                    <label for="fullName">Full Name</label>
                </div>

                <div class="form-floating mb-3">
                    <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" required>
                    <label for="email">Email address</label>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Account Type:</label>
                    <select class="form-select" name="user_type" required>
                        <option value="" selected disabled>Select account type</option>
                        <option value="student">Student</option>
                        <option value="cook">Cook</option>
                        <option value="admin">Administrator</option>
                    </select>
                </div>

                <div class="form-floating mb-3">
                    <input type="password" class="form-control" id="password" name="password" placeholder="Password" required>
                    <label for="password">Password</label>
                </div>

                <div class="form-floating mb-4">
                    <input type="password" class="form-control" id="confirmPassword" name="confirm_password" placeholder="Confirm Password" required>
                    <label for="confirmPassword">Confirm Password</label>
                </div>

                <button class="btn btn-primary w-100 py-2 mb-3" type="submit">Register</button>

                <p class="text-center text-muted mt-3">
                    Already have an account? <a href="/">Sign in</a>
                </p>
            </form>
        </div>
    </div>
</body>
</html>
